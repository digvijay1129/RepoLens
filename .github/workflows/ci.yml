name: RepoLens CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
      - "phase-1b/**"
      - "phase-2/**"
      - "phase-2a/**"
      - "phase-2b/**"
      - "phase-3/**"
      - "phase-3a/**"
      - "phase-3b/**"
      - "phase-4/**"
      - "phase-4a/**"
      - "phase-4b/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and live PostgreSQL schema verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start local PostgreSQL without Docker
        shell: bash
        run: |
          sudo service postgresql start
          CI_DB_PASSWORD="$(openssl rand -hex 24)"
          echo "DATABASE_URL=postgresql+psycopg://repolens_user:${CI_DB_PASSWORD}@127.0.0.1:5432/repolens" >> "$GITHUB_ENV"
          echo "REPOLENS_TEST_DATABASE_URL=postgresql+psycopg://repolens_user:${CI_DB_PASSWORD}@127.0.0.1:5432/repolens" >> "$GITHUB_ENV"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v repolens_password="$CI_DB_PASSWORD" <<'SQL'
          CREATE ROLE repolens_user WITH LOGIN PASSWORD :'repolens_password';
          SQL
          sudo -u postgres createdb --owner=repolens_user repolens
      - name: Apply schema migration to PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests, including live PostgreSQL checks
        working-directory: backend
        run: python -m pytest
      - name: Verify deployed PostgreSQL schema and migration version
        working-directory: backend
        run: python -m app.db.schema_check
      - name: Render PostgreSQL migration SQL without a connection
        working-directory: backend
        run: python -m alembic upgrade head --sql > /tmp/repolens-migration.sql

  frontend-quality:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
