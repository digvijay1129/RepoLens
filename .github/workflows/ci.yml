name: RepoLens CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
      - "phase-1b/**"
      - "phase-2/**"
      - "phase-2a/**"
      - "phase-2b/**"
      - "phase-3/**"
      - "phase-3a/**"
      - "phase-3b/**"
      - "phase-4/**"
      - "phase-4a/**"
      - "phase-4b/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and live PostgreSQL schema verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repolens_user
          POSTGRES_PASSWORD: repolens_ci_password
          POSTGRES_DB: repolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens_user -d repolens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Configure live PostgreSQL connection
        run: |
          echo "DATABASE_URL=postgresql+psycopg://repolens_user:repolens_ci_password@127.0.0.1:5432/repolens" >> "$GITHUB_ENV"
          echo "REPOLENS_TEST_DATABASE_URL=postgresql+psycopg://repolens_user:repolens_ci_password@127.0.0.1:5432/repolens" >> "$GITHUB_ENV"
      - name: Apply schema migration to PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests, including live PostgreSQL checks
        working-directory: backend
        run: python -m pytest
      - name: Verify deployed PostgreSQL schema and migration version
        working-directory: backend
        run: python -m app.db.schema_check
      - name: Render PostgreSQL migration SQL without a connection
        working-directory: backend
        run: python -m alembic upgrade head --sql > "$RUNNER_TEMP/repolens-migration.sql"

  frontend-quality:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  release-package:
    name: Build and validate source release ZIP
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package source-only release and validate archive
        run: python scripts/package_release.py --output "$RUNNER_TEMP/RepoLens-Release.zip"
      - name: Upload validated source release
        uses: actions/upload-artifact@v4
        with:
          name: RepoLens-Release
          path: ${{ runner.temp }}/RepoLens-Release.zip
          if-no-files-found: error
          retention-days: 30
