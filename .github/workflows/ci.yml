name: RepoLens CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
      - "phase-1b/**"
      - "phase-2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and migration SQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://repolens_user:ci_password@127.0.0.1:5432/repolens
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Render PostgreSQL migration SQL without a database server
        working-directory: backend
        run: python -m alembic upgrade head --sql > /tmp/repolens-migration.sql

  frontend-quality:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
